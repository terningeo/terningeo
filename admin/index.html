<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TERNINGEO — Налаштування</title>

    <link rel="stylesheet" href="admin.css">
</head>

<body>

<div class="admin-container">

    <!-- =====================================================
         LOGIN
    ====================================================== -->

    <div id="login-section">

        <h1>TERNINGEO</h1>

        <p>Налаштування</p>

        <form id="login-form">

            <input
                type="email"
                id="email"
                placeholder="Email"
                autocomplete="email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Пароль"
                autocomplete="current-password"
                required
            >

            <button type="submit">
                Увійти
            </button>

        </form>

        <div id="login-message"></div>

    </div>


    <!-- =====================================================
         ADMIN PANEL
    ====================================================== -->

    <div id="admin-section" style="display:none;">

        <div class="admin-header">

            <div>
                <h1>TERNINGEO</h1>
                <p>Керування сайтом</p>
            </div>

            <button
                type="button"
                id="logout-button"
            >
                Вийти
            </button>

        </div>


        <!-- =================================================
             PAGE SELECTOR
        ================================================== -->

        <section class="editor">

            <label for="page-select">
                Сторінка
            </label>

            <select id="page-select">

                <option value="home">
                    Головна
                </option>

                <option value="vynos">
                    Винос в натуру
                </option>

                <option value="topo">
                    Топографічна зйомка
                </option>

                <option value="suprovid">
                    Геодезичний супровід
                </option>

                <option value="kgz">
                    КГЗ
                </option>

            </select>

        </section>


        <!-- =================================================
             CONTENT EDITOR
        ================================================== -->

        <section class="editor">

            <h2 id="page-title">
                Головна сторінка
            </h2>

            <div id="content-editor">

                <p>
                    Завантаження...
                </p>

            </div>

        </section>


        <!-- =================================================
             GLOBAL MESSAGE
        ================================================== -->

        <div id="global-message"></div>

    </div>

</div>


<!-- =========================================================
     SUPABASE
========================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<!-- =========================================================
     ADMIN JAVASCRIPT
========================================================== -->

<script src="admin.js"></script>

</body>
</html>
